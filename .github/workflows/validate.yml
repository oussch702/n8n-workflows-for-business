name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tools
      - name: Validate every workflow against n8n's node schemas
        run: node tools/validate.mjs workflows/*/workflow.json
